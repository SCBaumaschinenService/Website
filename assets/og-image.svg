<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F57C20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e06010;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Orange accent bar bottom -->
  <rect x="0" y="590" width="1200" height="4" fill="url(#accent)" opacity="0.4"/>

  <!-- SC Logo circle -->
  <circle cx="140" cy="200" r="72" fill="rgba(245,124,32,0.1)" stroke="#F57C20" stroke-width="2"/>
  <text x="140" y="218" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#F57C20" text-anchor="middle" letter-spacing="-2">SC</text>

  <!-- Company name -->
  <text x="240" y="180" font-family="Arial, sans-serif" font-weight="800" font-size="58" fill="#ffffff" letter-spacing="-1">SC Baumaschinen</text>
  <text x="240" y="240" font-family="Arial, sans-serif" font-weight="400" font-size="38" fill="rgba(255,255,255,0.6)" letter-spacing="2">SERVICE</text>

  <!-- Divider -->
  <rect x="60" y="300" width="500" height="2" fill="#F57C20" opacity="0.6"/>

  <!-- Slogan -->
  <text x="60" y="370" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#ffffff">Qualität aus Meisterhand</text>

  <!-- Sub-slogan -->
  <text x="60" y="430" font-family="Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.55)">Reparatur · UVV-Prüfung · Mobiler Service</text>

  <!-- Region -->
  <text x="60" y="480" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="rgba(255,255,255,0.4)">Von Stuttgart bis Karlsruhe</text>

  <!-- Right side decorative element -->
  <circle cx="980" cy="315" r="220" fill="rgba(245,124,32,0.04)" stroke="rgba(245,124,32,0.12)" stroke-width="1"/>
  <circle cx="980" cy="315" r="160" fill="rgba(245,124,32,0.04)" stroke="rgba(245,124,32,0.08)" stroke-width="1"/>
  <circle cx="980" cy="315" r="90" fill="rgba(245,124,32,0.06)" stroke="rgba(245,124,32,0.15)" stroke-width="1"/>

  <!-- Wrench icon (simplified) -->
  <g transform="translate(948, 283) rotate(-45, 32, 32)">
    <rect x="22" y="0" width="20" height="64" rx="10" fill="none" stroke="rgba(245,124,32,0.35)" stroke-width="3"/>
    <circle cx="32" cy="12" r="12" fill="none" stroke="rgba(245,124,32,0.35)" stroke-width="3"/>
  </g>

  <!-- Domain -->
  <text x="60" y="565" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#F57C20">www.sc-baumaschinen.de</text>
</svg>